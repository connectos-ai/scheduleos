services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduleos_test
      POSTGRES_USER: scheduleos
      POSTGRES_PASSWORD: scheduleos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduleos -d scheduleos_test"]
      interval: 2s
      timeout: 3s
      retries: 20
